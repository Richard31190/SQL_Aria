<!-- templates\admin\login.html -->
{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="bg-white dark:bg-slate-800 p-8 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 w-full max-w-md">
        <div class="text-center mb-8">
            <i class="fa-solid fa-lock text-cyan-500 text-4xl mb-4"></i>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Administration</h1>
            <p class="text-slate-500 text-sm">Veuillez saisir le mot de passe</p>
        </div>
        <form method="POST" class="space-y-4">
            <div>
                <input type="password" name="password" placeholder="Mot de passe" required
                       class="w-full px-4 py-3 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-cyan-500 outline-none">
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="text-red-500 text-xs font-bold text-center">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <button type="submit" class="w-full py-3 bg-cyan-600 hover:bg-cyan-700 text-white rounded-lg font-bold transition-colors">
                Connexion
            </button>
        </form>
    </div>
</div>
{% endblock %}
