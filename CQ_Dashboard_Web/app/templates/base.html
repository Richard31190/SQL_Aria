<!-- templates\base.html -->
<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_title }}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Anti-Flash Dark Mode Script -->
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0 border-r border-slate-800">
        <div class="h-16 flex items-center justify-between px-4 bg-slate-950 border-b border-slate-800">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-[#0284c7] fa-radiation text-2xl text-cyan-400"></i>
                <span class="font-bold text-lg text-white tracking-wide">CQ Dashboard</span>
            </div>
        </div>

        <nav class="flex-1 px-3 py-4 space-y-1">
            <a href="/" class="flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white {% if request.endpoint == 'main.index' %}bg-slate-800 text-cyan-400 border-l-4 border-cyan-400{% endif %}">
                <i class="fa-solid fa-list-check w-6 text-center text-lg"></i>
                <span class="ml-2">Machines</span>
            </a>

            <a href="/admin" class="flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white {% if request.endpoint and 'admin' in request.endpoint %}bg-slate-800 text-cyan-400 border-l-4 border-cyan-400{% endif %}">
                <i class="fa-solid fa-sliders w-6 text-center text-lg"></i>
                <span class="ml-2">Administration</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
            <span>IUCT Oncopole</span>
            <button id="theme-toggle" class="p-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white focus:outline-none">
                <i id="theme-toggle-dark-icon" class="fa-solid fa-moon text-base"></i>
                <i id="theme-toggle-light-icon" class="fa-solid fa-sun text-base hidden text-yellow-400"></i>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Dark Mode Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        if (document.documentElement.classList.contains('dark')) {
            lightIcon.classList.remove('hidden');
        } else {
            darkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function () {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
