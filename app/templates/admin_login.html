{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-md border border-slate-200 p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-blue-50 flex items-center justify-center mb-4">
                <i class="fa-solid fa-shield-halved text-2xl text-blue-600"></i>
            </div>
            <h3 class="text-2xl font-bold text-slate-800">Acces Securise</h3>
            <p class="text-sm text-slate-500 mt-1">Administration CQ Dashboard</p>
        </div>

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1.5">Mot de passe Administrateur</label>
                <input type="password" name="password" required autofocus
                       class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                       placeholder="Mot de passe">
            </div>
            <button type="submit"
                    class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold shadow-md transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-unlock"></i>
                Deverrouiller l'Administration
            </button>
        </form>
    </div>
</div>
{% endblock %}
